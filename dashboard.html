<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | LinguaFlow</title>
    <meta name="description"
        content="LinguaFlow admin dashboard for managing translation projects, users, orders, and analytics.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>
    <!-- Mobile Header (visible only on mobile) -->
    <header class="dashboard-mobile-header">
        <a href="index.html" class="mobile-brand-center">
           
            <span>LinguaFlow</span>
        </a>
    </header>

    <!-- Dashboard Container -->
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header hide-on-mobile">
                <a href="index.html" class="logo">
                    <i class="fas fa-language"></i>
                    <span>LinguaFlow</span>
                </a>
                <div class="sidebar-toggle">
                    <i class="fas fa-th"></i>
                </div>
            </div>

            <nav class="sidebar-nav">
                <ul class="nav-menu">
                    <li class="nav-item active">
                        <a href="#" data-page="analytics">
                            <i class="fas fa-chart-line"></i>
                            <span>Analytics</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" data-page="users">
                            <i class="fas fa-users"></i>
                            <span>Users</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" data-page="orders">
                            <i class="fas fa-shopping-cart"></i>
                            <span>Orders</span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a href="#" data-page="messages">
                            <i class="fas fa-envelope"></i>
                            <span>Messages</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="dashboard-header">
                <div class="header-left">
                    <h1 class="page-title">Analytics Dashboard</h1>
                    <p class="page-subtitle">Overview of your translation business performance</p>
                </div>
                <div class="header-right">
                    <button class="btn btn-outline">
                        <i class="fas fa-bell"></i>
                        Notifications
                    </button>
                    <button class="theme-toggle" id="themeToggle">
                        <i class="fas fa-moon"></i>
                    </button>
                    <button class="btn btn-primary">
                        <i class="fas fa-download"></i>
                        Export Report
                    </button>
                </div>
            </header>

            <!-- Analytics Page -->
            <div class="page-content" id="analytics-page">
                <!-- Stats Cards -->
                <div class="stats-grid">
                    <div class="stat-card scale-in">
                        <div class="stat-icon">
                            <i class="fas fa-file-alt"></i>
                        </div>
                        <div class="stat-content">
                            <h3>Total Projects</h3>
                            <div class="stat-number">1,247</div>
                            <div class="stat-change positive">
                                <i class="fas fa-arrow-up"></i>
                                <span>12.5%</span>
                            </div>
                        </div>
                    </div>

                    <div class="stat-card scale-in-delay">
                        <div class="stat-icon">
                            <i class="fas fa-users"></i>
                        </div>
                        <div class="stat-content">
                            <h3>Active Clients</h3>
                            <div class="stat-number">486</div>
                            <div class="stat-change positive">
                                <i class="fas fa-arrow-up"></i>
                                <span>8.3%</span>
                            </div>
                        </div>
                    </div>

                    <div class="stat-card scale-in-delay-2">
                        <div class="stat-icon">
                            <i class="fas fa-dollar-sign"></i>
                        </div>
                        <div class="stat-content">
                            <h3>Revenue</h3>
                            <div class="stat-number">$124,563</div>
                            <div class="stat-change positive">
                                <i class="fas fa-arrow-up"></i>
                                <span>15.7%</span>
                            </div>
                        </div>
                    </div>

                    <div class="stat-card scale-in-delay-3">
                        <div class="stat-icon">
                            <i class="fas fa-language"></i>
                        </div>
                        <div class="stat-content">
                            <h3>Words Translated</h3>
                            <div class="stat-number">2.3M</div>
                            <div class="stat-change positive">
                                <i class="fas fa-arrow-up"></i>
                                <span>22.1%</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Charts Section -->
                <div class="charts-section">
                    <div class="chart-row">
                        <div class="chart-card fade-in">
                            <div class="chart-placeholder">
                                <div class="chart-overlay">
                                    <i class="fas fa-chart-line"></i>
                                    <span>Revenue Chart</span>
                                </div>
                            </div>
                        </div>

                        <div class="chart-card fade-in-delay">
                            <div class="chart-placeholder">
                                <div class="chart-overlay">
                                    <i class="fas fa-chart-pie"></i>
                                    <span>Language Chart</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Dashboard Styles -->
    <style>
        /* Dashboard Layout */
        .dashboard-container {
            display: flex;
            min-height: 100vh;
            background-color: var(--gray-50);
        }

        .sidebar {
            width: 280px;
            background-color: var(--primary-color);
            color: var(--white);
            display: flex;
            flex-direction: column;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            z-index: 1000;
        }

        .sidebar-header {
            padding: var(--spacing-lg);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sidebar-header .logo {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            font-weight: var(--font-weight-bold);
            font-size: 1.25rem;
        }

        .sidebar-header .logo i {
            color: var(--accent-color);
            font-size: 1.5rem;
        }

        .sidebar-nav {
            flex: 1;
            padding: var(--spacing-lg) 0;
            overflow-y: auto;
        }

        .nav-menu {
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .nav-item {
            margin-bottom: var(--spacing-xs);
        }

        .nav-item a {
            display: flex;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md) var(--spacing-lg);
            color: var(--gray-300);
            text-decoration: none;
            border-radius: var(--radius-md);
            transition: all var(--transition-normal);
        }

        .nav-item:hover a,
        .nav-item.active a {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--white);
        }

        .nav-item i {
            width: 20px;
            text-align: center;
        }

        /* Main Content */
        .main-content {
            flex: 1;
            margin-left: 280px;
            background-color: var(--white);
            min-height: 100vh;
        }

        /* Dashboard Header */
        .dashboard-header {
            padding: var(--spacing-xl) var(--spacing-2xl);
            border-bottom: 1px solid var(--gray-200);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            background-color: var(--white);
        }

        .page-title {
            font-size: 2rem;
            font-weight: var(--font-weight-bold);
            color: var(--gray-900);
            margin-bottom: var(--spacing-xs);
        }

        .page-subtitle {
            color: var(--gray-600);
            font-size: 1rem;
        }

        /* Page Content */
        .page-content {
            padding: var(--spacing-2xl);
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: var(--spacing-xl);
            margin-bottom: var(--spacing-2xl);
        }

        .stat-card {
            background-color: var(--white);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--gray-200);
            display: flex;
            align-items: center;
            gap: var(--spacing-lg);
        }

        .stat-icon {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--accent-color), var(--accent-light));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 1.5rem;
        }

        .stat-content h3 {
            font-size: 0.875rem;
            color: var(--gray-600);
            margin-bottom: var(--spacing-sm);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: var(--font-weight-bold);
            color: var(--gray-900);
            margin-bottom: var(--spacing-sm);
        }

        .stat-change {
            display: flex;
            align-items: center;
            gap: var(--spacing-xs);
            font-size: 0.875rem;
        }

        .stat-change.positive {
            color: var(--secondary-color);
        }

        /* Charts */
        .charts-section {
            margin-bottom: var(--spacing-2xl);
        }

        .chart-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: var(--spacing-xl);
            margin-bottom: var(--spacing-xl);
        }

        .chart-card {
            background-color: var(--white);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--gray-200);
        }

        .chart-placeholder {
            height: 300px;
            background: var(--gray-50);
            border-radius: var(--radius-md);
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .chart-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: var(--gray-400);
        }

        .chart-overlay i {
            font-size: 2rem;
            margin-bottom: var(--spacing-sm);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .main-content {
                margin-left: 0;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .chart-row {
                grid-template-columns: 1fr;
            }
        }
    </style>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Sidebar navigation
            const navItems = document.querySelectorAll('.nav-item a');
            const pages = document.querySelectorAll('.page-content');

            navItems.forEach(item => {
                item.addEventListener('click', function (e) {
                    e.preventDefault();

                    const targetPage = this.dataset.page;

                    // Update active state
                    navItems.forEach(nav => nav.classList.remove('active'));
                    this.classList.add('active');

                    // Show corresponding page
                    pages.forEach(page => {
                        page.style.display = 'none';
                    });

                    const targetPageElement = document.getElementById(`${targetPage}-page`);
                    if (targetPageElement) {
                        targetPageElement.style.display = 'block';
                    }
                });
            });

            // Sidebar toggle for mobile
            const sidebarToggles = document.querySelectorAll('.sidebar-toggle, .sidebar-toggle-btn');
            const sidebar = document.querySelector('.sidebar');

            sidebarToggles.forEach(toggle => {
                toggle.addEventListener('click', function () {
                    sidebar.classList.toggle('collapsed');
                });
            });
        });
    </script>

    <!-- Main JavaScript -->

    <script src="js/main.js"></script>
</body>

</html>
