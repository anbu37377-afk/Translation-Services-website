<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LinguaFlow</title>
    <meta name="description"
        content="Login to your LinguaFlow account. Access your translation projects, manage orders, and track your translation history.">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/menu-icon.css">
    <style>
        /* Login-only spacing fix: reduce empty top/bottom space around the auth card */
        .login-auth-section {
            margin: 0;
            padding: 72px 0 36px;
            min-height: auto;
            align-items: flex-start;
        }

        @media (max-width: 480px) {
            .login-auth-section {
                padding: 64px var(--spacing-md) 24px;
            }

            .login-auth-section .auth-options {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                gap: var(--spacing-sm);
            }

            .login-auth-section .auth-options .forgot-password {
                white-space: nowrap;
                margin: 0;
                display: inline-flex;
                align-items: center;
                line-height: 1;
                min-height: 20px;
            }

            .login-auth-section .auth-options .checkbox-label {
                margin: 0;
            }
        }
    </style>
</head>

<body>
    <!-- Login Section -->
    <section class="auth-section login-auth-section">
        <div class="auth-container scale-in">
            <!-- Brand Logo -->
            <div class="auth-brand">
                <a href="index.html" class="logo">
                    <i class="fas fa-language"></i>
                    <span>LinguaFlow</span>
                </a>
            </div>
            <div class="auth-header">
                <h1>Welcome Back</h1>
                <p>Login to your account to continue</p>
            </div>

            <form class="auth-form" id="loginForm">
                <div class="form-group fade-in-delay">
                    <label for="email">Email Address</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                    </div>
                    <span class="error-message"
                        style="color: #e74c3c; font-size: 0.75rem; margin-top: 0.25rem; display: none;"></span>
                </div>

                <div class="form-group fade-in-delay-2">
                    <label for="password">Password</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <span class="error-message"
                        style="color: #e74c3c; font-size: 0.75rem; margin-top: 0.25rem; display: none;"></span>
                </div>

                <div class="auth-options fade-in-delay-3">
                    <label class="checkbox-label"
                        style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkmark"></span>
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary auth-submit fade-in-delay-4">
                    <span class="btn-text">Login</span>
                    <i class="fas fa-spinner fa-spin loading-spinner" style="display: none;"></i>
                </button>
            </form>

            <div class="auth-divider fade-in-delay-5">
                <span>Or continue with</span>
            </div>

            <div class="social-buttons fade-in-delay-5">
                <button type="button" class="btn-social google">
                    <i class="fab fa-google"></i>
                    <span>Google</span>
                </button>
                <button type="button" class="btn-social facebook">
                    <i class="fab fa-facebook-f"></i>
                    <span>Facebook</span>
                </button>
            </div>

            <div class="auth-footer fade-in-delay-6">
                <p>Don't have an account? <a href="signup.html">Sign up for free</a></p>
            </div>
        </div>
    </section>



    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const loginForm = document.getElementById('loginForm');


            // Form validation and submission
            if (loginForm) {
                loginForm.addEventListener('submit', function (e) {
                    e.preventDefault();

                    if (validateLoginForm()) {
                        const submitBtn = this.querySelector('button[type="submit"]');
                        const btnText = submitBtn.querySelector('.btn-text');
                        const spinner = submitBtn.querySelector('.loading-spinner');

                        if (btnText) btnText.style.display = 'none';
                        if (spinner) spinner.style.display = 'inline-block';
                        submitBtn.disabled = true;

                        // Simulate login process
                        setTimeout(() => {
                            // Redirect to dashboard or home page
                            window.location.href = 'index.html';
                        }, 2000);
                    }
                });
            }

            function validateLoginForm() {
                const email = document.getElementById('email');
                const password = document.getElementById('password');
                let isValid = true;

                // Reset error states
                document.querySelectorAll('.error-message').forEach(el => el.style.display = 'none');
                document.querySelectorAll('input').forEach(el => el.style.borderColor = 'var(--gray-200)');

                // Validate email
                if (!email.value.trim()) {
                    showError(email, 'Email is required');
                    isValid = false;
                } else if (!isValidEmail(email.value)) {
                    showError(email, 'Please enter a valid email address');
                    isValid = false;
                }

                // Validate password
                if (!password.value.trim()) {
                    showError(password, 'Password is required');
                    isValid = false;
                } else if (password.value.length < 6) {
                    showError(password, 'Password must be at least 6 characters');
                    isValid = false;
                }

                return isValid;
            }

            function showError(input, message) {
                const formGroup = input.closest('.form-group');
                const errorMessage = formGroup.querySelector('.error-message');
                input.style.borderColor = '#e74c3c';
                if (errorMessage) {
                    errorMessage.textContent = message;
                    errorMessage.style.display = 'block';
                }
            }

            function isValidEmail(email) {
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return emailRegex.test(email);
            }
        });
    </script>
</body>

</html>
