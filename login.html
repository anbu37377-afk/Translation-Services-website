<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LinguaFlow</title>
    <meta name="description"
        content="Login to your LinguaFlow account. Access your translation projects, manage orders, and track your translation history.">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
</head>

<body>
    <!-- Login Container -->
    <div class="login-container">
        <!-- Login Form -->
        <div class="login-form-container scale-in">
            <!-- Brand Logo -->
            <div class="login-brand fade-in">
                <a href="index.html" class="logo">
                    <i class="fas fa-language"></i>
                    <span>LinguaFlow</span>
                </a>
            </div>
            <div class="login-header">
                <h1>Welcome Back</h1>
                <p>Login to your LinguaFlow account to access your translation projects</p>
            </div>

            <form class="login-form" id="loginForm">
                <div class="form-group fade-in-delay">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" name="email" placeholder="Enter your email address" required>
                    </div>
                    <span class="error-message"></span>
                </div>

                <div class="form-group fade-in-delay-2">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <span class="error-message"></span>
                </div>

                <div class="form-options fade-in-delay-3">
                    <label class="checkbox-label">
                        <input type="checkbox" id="remember" name="remember">
                        <span class="checkmark"></span>
                        Remember me for 30 days
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-large fade-in-delay-4">
                    <span class="btn-text">Login</span>
                    <i class="fas fa-spinner fa-spin loading-spinner"></i>
                </button>
            </form>

            <!-- Social Login -->
            <div class="social-login fade-in-delay-5">
                <div class="divider">
                    <span>Or continue with</span>
                </div>
                <div class="social-buttons">
                    <button type="button" class="btn-social google">
                        <i class="fab fa-google"></i>
                        <span>Google</span>
                    </button>
                    <button type="button" class="btn-social facebook">
                        <i class="fab fa-facebook-f"></i>
                        <span>Facebook</span>
                    </button>
                </div>
            </div>

            <!-- Sign Up Link -->
            <div class="signup-link fade-in-delay-6">
                <p>Don't have an account? <a href="signup.html">Sign up for free</a></p>
            </div>
        </div>

        <!-- Background Elements -->
        <div class="login-background">
            <div class="bg-shape bg-shape-1"></div>
            <div class="bg-shape bg-shape-2"></div>
            <div class="bg-shape bg-shape-3"></div>
        </div>
    </div>

    <!-- Custom Styles for Login Page -->
    <style>
        /* Login Page Specific Styles */
        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: var(--spacing-2xl) var(--spacing-md);
        }

        .login-container {
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 1;
        }

        .login-brand {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .login-brand .logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: var(--spacing-sm);
            font-weight: var(--font-weight-bold);
            font-size: 1.5rem;
            color: var(--gray-900);
            text-decoration: none;
            transition: transform var(--transition-normal);
            position: relative;
            z-index: 100;
            cursor: pointer;
            width: 100%;
            padding: var(--spacing-md) 0;
            pointer-events: auto;
        }

        [data-theme="dark"] .login-brand .logo {
            color: var(--white);
        }

        .login-brand .logo:hover {
            transform: scale(1.05);
        }

        .login-brand .logo i {
            color: var(--accent-color);
            font-size: 1.75rem;
        }

        .login-form-container {
            background: var(--white);
            border-radius: var(--radius-2xl);
            padding: var(--spacing-3xl);
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        [data-theme="dark"] .login-form-container {
            background: var(--gray-50);
            border-color: var(--gray-300);
        }

        .login-header {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .login-header h1 {
            font-size: 2rem;
            font-weight: var(--font-weight-bold);
            color: var(--gray-900);
            margin-bottom: var(--spacing-md);
        }

        .login-header p {
            color: var(--gray-600);
            font-size: 0.95rem;
        }

        .login-form {
            margin-bottom: var(--spacing-xl);
        }

        .form-group {
            margin-bottom: var(--spacing-lg);
        }

        .form-group label {
            display: block;
            font-weight: var(--font-weight-medium);
            color: var(--gray-700);
            margin-bottom: var(--spacing-sm);
            font-size: 0.875rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            color: var(--gray-400);
            font-size: 1rem;
            z-index: 1;
        }

        .input-wrapper input {
            width: 100%;
            padding: var(--spacing-md) var(--spacing-md) var(--spacing-md) 3rem;
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-md);
            font-size: 1rem;
            transition: all var(--transition-normal);
            background-color: var(--white);
            color: var(--gray-700);
        }

        [data-theme="dark"] .input-wrapper input {
            background-color: var(--gray-100);
            border-color: var(--gray-300);
            color: var(--gray-700);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(0, 168, 232, 0.1);
        }

        .toggle-password {
            position: absolute;
            right: var(--spacing-md);
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--gray-400);
            cursor: pointer;
            font-size: 1rem;
            transition: color var(--transition-normal);
        }

        .toggle-password:hover {
            color: var(--accent-color);
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--spacing-xl);
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--gray-600);
        }

        .checkbox-label input[type="checkbox"] {
            display: none;
        }

        .checkmark {
            width: 20px;
            height: 20px;
            border: 2px solid var(--gray-300);
            border-radius: var(--radius-sm);
            margin-right: var(--spacing-sm);
            position: relative;
            transition: all var(--transition-normal);
        }

        .checkbox-label input[type="checkbox"]:checked+.checkmark {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .checkbox-label input[type="checkbox"]:checked+.checkmark::after {
            content: '\f00c';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--white);
            font-size: 0.75rem;
        }

        .forgot-password {
            color: var(--accent-color);
            text-decoration: none;
            font-size: 0.875rem;
            font-weight: var(--font-weight-medium);
            transition: color var(--transition-normal);
        }

        .forgot-password:hover {
            color: var(--accent-dark);
        }

        .btn-large {
            width: 100%;
            padding: var(--spacing-lg) var(--spacing-xl);
            font-size: 1rem;
            min-height: 52px;
        }

        .loading-spinner {
            display: none;
        }

        .btn-large.loading .btn-text {
            display: none;
        }

        .btn-large.loading .loading-spinner {
            display: inline-block;
        }

        .social-login {
            margin-bottom: var(--spacing-xl);
        }

        .divider {
            text-align: center;
            position: relative;
            margin: var(--spacing-lg) 0;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background-color: var(--gray-200);
        }

        .divider span {
            background-color: var(--white);
            padding: 0 var(--spacing-md);
            color: var(--gray-500);
            font-size: 0.875rem;
            position: relative;
        }

        [data-theme="dark"] .divider span {
            background-color: var(--gray-50);
        }

        .social-buttons {
            display: flex;
            gap: var(--spacing-md);
        }

        .btn-social {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-md);
            border: 2px solid var(--gray-200);
            border-radius: var(--radius-md);
            background-color: var(--white);
            color: var(--gray-700);
            font-weight: var(--font-weight-medium);
            font-size: 0.875rem;
            transition: all var(--transition-normal);
            cursor: pointer;
        }

        [data-theme="dark"] .btn-social {
            background-color: var(--gray-50);
            border-color: var(--gray-300);
        }

        .btn-social:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-social.google:hover {
            border-color: #4285f4;
            color: #4285f4;
        }

        .btn-social.facebook:hover {
            border-color: #1877f2;
            color: #1877f2;
        }

        .signup-link {
            text-align: center;
        }

        .signup-link p {
            color: var(--gray-600);
            font-size: 0.875rem;
        }

        .signup-link a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: var(--font-weight-medium);
            transition: color var(--transition-normal);
        }

        .signup-link a:hover {
            color: var(--accent-dark);
        }

        .login-background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .bg-shape-1 {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .bg-shape-2 {
            width: 200px;
            height: 200px;
            bottom: -100px;
            right: -100px;
            animation-delay: 2s;
        }

        .bg-shape-3 {
            width: 150px;
            height: 150px;
            top: 50%;
            left: 50%;
            animation-delay: 4s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }

        .error-message {
            display: block;
            color: #e74c3c;
            font-size: 0.75rem;
            margin-top: var(--spacing-xs);
            display: none;
        }

        .form-group.error input {
            border-color: #e74c3c;
        }

        .form-group.error .error-message {
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .login-container {
                padding: var(--spacing-md);
            }

            .login-form-container {
                padding: var(--spacing-xl);
            }

            .social-buttons {
                flex-direction: column;
            }

            .form-options {
                flex-direction: column;
                gap: var(--spacing-md);
                align-items: flex-start;
            }
        }
    </style>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const loginForm = document.getElementById('loginForm');
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');

            // Toggle password visibility
            togglePassword.addEventListener('click', function () {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);

                const icon = this.querySelector('i');
                icon.className = type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash';
            });

            // Form validation and submission
            loginForm.addEventListener('submit', function (e) {
                e.preventDefault();

                if (validateLoginForm()) {
                    const submitBtn = this.querySelector('button[type="submit"]');
                    submitBtn.classList.add('loading');

                    // Simulate login process
                    setTimeout(() => {
                        // Redirect to dashboard or home page
                        window.location.href = 'index.html';
                    }, 2000);
                }
            });

            // Social login handlers
            document.querySelector('.btn-social.google').addEventListener('click', function () {
                // Simulate Google login
                console.log('Google login initiated');
                // In a real implementation, this would redirect to Google OAuth
            });

            document.querySelector('.btn-social.facebook').addEventListener('click', function () {
                // Simulate Facebook login
                console.log('Facebook login initiated');
                // In a real implementation, this would redirect to Facebook OAuth
            });
        });

        function validateLoginForm() {
            const email = document.getElementById('email');
            const password = document.getElementById('password');
            let isValid = true;

            // Reset error states
            document.querySelectorAll('.form-group').forEach(group => {
                group.classList.remove('error');
            });

            // Validate email
            if (!email.value.trim()) {
                showError(email, 'Email is required');
                isValid = false;
            } else if (!isValidEmail(email.value)) {
                showError(email, 'Please enter a valid email address');
                isValid = false;
            }

            // Validate password
            if (!password.value.trim()) {
                showError(password, 'Password is required');
                isValid = false;
            } else if (password.value.length < 6) {
                showError(password, 'Password must be at least 6 characters');
                isValid = false;
            }

            return isValid;
        }

        function showError(input, message) {
            const formGroup = input.closest('.form-group');
            formGroup.classList.add('error');
            const errorMessage = formGroup.querySelector('.error-message');
            errorMessage.textContent = message;
        }

        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
    </script>
</body>

</html>
