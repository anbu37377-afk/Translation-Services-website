<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | LinguaFlow</title>
    <meta name="description" content="404 error page - Page not found. Return to LinguaFlow homepage for professional translation services.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <!-- 404 Container -->
    <div class="error-container">
        <!-- Error Content -->
        <div class="error-content scale-in">
            <div class="error-visual">
                <div class="error-icon">
                    <i class="fas fa-exclamation-triangle"></i>
                </div>
                <div class="error-code">404</div>
            </div>
            
            <h1 class="error-title fade-in">Page Not Found</h1>
            <p class="error-message fade-in-delay">
                Oops! The page you're looking for doesn't exist or has been moved. 
                Let's get you back to the right place.
            </p>
            
            <div class="error-actions fade-in-delay-2">
                <a href="index.html" class="btn btn-primary btn-large">
                    <i class="fas fa-home"></i>
                    Go Home
                </a>
                <a href="contact.html" class="btn btn-outline btn-large">
                    <i class="fas fa-envelope"></i>
                    Contact Support
                </a>
            </div>
            
            <div class="search-suggestions fade-in-delay-3">
                <h3>Maybe you were looking for:</h3>
                <div class="suggestions-list">
                    <a href="services.html">Translation Services</a>
                    <a href="languages.html">Languages We Translate</a>
                    <a href="pricing.html">Pricing Plans</a>
                    <a href="about.html">About Us</a>
                    <a href="contact.html">Contact</a>
                    <a href="blog.html">Blog</a>
                </div>
            </div>
        </div>
        
        <!-- Background Elements -->
        <div class="error-background">
            <div class="bg-shape bg-shape-1"></div>
            <div class="bg-shape bg-shape-2"></div>
            <div class="bg-shape bg-shape-3"></div>
            <div class="bg-shape bg-shape-4"></div>
        </div>
    </div>

    <!-- Custom Styles for 404 Page -->
    <style>
        /* 404 Page Specific Styles */
        body {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--accent-color) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--spacing-lg);
            font-family: var(--font-family);
        }

        .error-container {
            width: 100%;
            max-width: 600px;
            position: relative;
            z-index: 1;
        }

        .error-content {
            background: var(--white);
            border-radius: var(--radius-2xl);
            padding: var(--spacing-3xl);
            box-shadow: var(--shadow-xl);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        [data-theme="dark"] .error-content {
            background: var(--gray-50);
            border: 1px solid var(--gray-300);
        }

        .error-visual {
            margin-bottom: var(--spacing-2xl);
            position: relative;
        }

        .error-icon {
            font-size: 6rem;
            color: var(--accent-color);
            margin-bottom: var(--spacing-lg);
            animation: pulse 2s ease infinite;
        }

        .error-code {
            font-size: 4rem;
            font-weight: var(--font-weight-extrabold);
            color: var(--gray-300);
            margin-top: var(--spacing-md);
        }

        .error-title {
            font-size: 2.5rem;
            font-weight: var(--font-weight-bold);
            color: var(--gray-900);
            margin-bottom: var(--spacing-md);
            line-height: 1.2;
        }

        [data-theme="dark"] .error-title {
            color: var(--gray-900);
        }

        .error-message {
            font-size: 1.125rem;
            color: var(--gray-600);
            margin-bottom: var(--spacing-2xl);
            line-height: 1.6;
        }

        [data-theme="dark"] .error-message {
            color: var(--gray-400);
        }

        .error-actions {
            display: flex;
            gap: var(--spacing-lg);
            justify-content: center;
            margin-bottom: var(--spacing-2xl);
        }

        .search-suggestions {
            background-color: var(--gray-50);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            margin-top: var(--spacing-2xl);
        }

        [data-theme="dark"] .search-suggestions {
            background-color: var(--gray-100);
        }

        .search-suggestions h3 {
            font-size: 1rem;
            font-weight: var(--font-weight-semibold);
            color: var(--gray-700);
            margin-bottom: var(--spacing-md);
        }

        [data-theme="dark"] .search-suggestions h3 {
            color: var(--gray-300);
        }

        .suggestions-list {
            display: flex;
            flex-direction: column;
            gap: var(--spacing-sm);
        }

        .suggestions-list a {
            color: var(--accent-color);
            text-decoration: none;
            padding: var(--spacing-sm) var(--spacing-md);
            border-radius: var(--radius-md);
            transition: all var(--transition-normal);
            text-align: center;
            font-weight: var(--font-weight-medium);
        }

        .suggestions-list a:hover {
            background-color: var(--accent-color);
            color: var(--white);
            transform: translateY(-2px);
        }

        .error-background {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 0;
            overflow: hidden;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .bg-shape-1 {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .bg-shape-2 {
            width: 200px;
            height: 200px;
            bottom: -100px;
            right: -100px;
            animation-delay: 2s;
        }

        .bg-shape-3 {
            width: 150px;
            height: 150px;
            top: 50%;
            left: 50%;
            animation-delay: 4s;
        }

        .bg-shape-4 {
            width: 100px;
            height: 100px;
            top: 20%;
            right: 10%;
            animation-delay: 6s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.8;
                transform: scale(1.05);
            }
        }

        /* Responsive Design */
        @media (max-width: 480px) {
            .error-container {
                padding: var(--spacing-md);
            }

            .error-content {
                padding: var(--spacing-xl);
            }

            .error-actions {
                flex-direction: column;
            }

            .suggestions-list {
                flex-direction: column;
            }
        }
    </style>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Auto-redirect after 10 seconds
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 10000);
        });
    </script>
</body>
</html>
